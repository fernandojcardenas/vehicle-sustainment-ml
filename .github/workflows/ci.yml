name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Install PyTorch (CPU)
        run: pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu

      - name: Lint (ruff)
        run: ruff check .

      - name: Fetch C-MAPSS data (SHA-256 pinned)
        run: python scripts/fetch_data.py

      - name: Build the Parquet data set + quality checks
        run: python scripts/build_dataset.py

      - name: Train + evaluate the RUL baselines (must run end to end)
        run: python scripts/train_baseline.py

      - name: Train the sequence model end to end (smoke, FD001)
        run: python scripts/train_seqmodel.py --subsets FD001 --max-epochs 15 --out-md /tmp/mc.md --out-json /tmp/sj.json

      - name: Tests (baselines reproduce; sequence model trains + beats trivial)
        run: python -m pytest -q
